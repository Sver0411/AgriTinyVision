name: tests
on: [push, pull_request]
jobs:
  synthetic-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[dev]'
      - run: ruff check agritinyvision scripts tests
      - run: pytest -q
# CI uses synthetic fixtures only. No GPU training or public dataset download.
