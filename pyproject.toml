[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agritinyvision"
version = "0.3.0"
description = "Reproducible agricultural Tiny Vision model pipeline for Gateway A ESP32-S3"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["torch>=2.5,<3", "torchvision>=0.20,<1", "numpy>=1.26,<3", "Pillow>=10,<13", "PyYAML>=6,<7", "scikit-learn>=1.4,<2", "onnx>=1.17,<2", "onnxruntime>=1.20,<2", "jsonschema>=4.22,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]
esp = ["esp-ppq"]
camera = ["opencv-python>=4.10,<5", "pyserial>=3.5,<4", "matplotlib>=3.9,<4"]
web = ["Flask>=3.1,<4"]

[project.scripts]
agritinyvision = "agritinyvision.cli:main"
agritinyvision-camera = "agritinyvision.pc_camera.cli:main"

[tool.setuptools.packages.find]
include = ["agritinyvision*"]

[tool.setuptools.package-data]
"agritinyvision.pc_camera" = ["web_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not hardware and not local_artifact'"
markers = [
    "hardware: requires an explicitly selected physical ESP32 device",
    "local_artifact: requires frozen model files supplied outside Git",
    "simulated_hardware: simulated serial transport or host-compiled firmware core; not physical hardware",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
