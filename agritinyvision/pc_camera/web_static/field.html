<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="atv-token" content="__TOKEN__"><title>AgriTinyVision · 采集与标注</title><link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/field.css"><script src="/assets/field.js" defer></script></head>
<body><div class="app-shell"><aside class="sidebar"><a class="brand" href="/">AgriTinyVision</a><a class="nav-item" href="/">设备工作台</a><a class="nav-item selected" href="/field">采集与标注</a></aside>
<main><header class="page-header"><h1>采集与标注</h1><span id="connection">等待连接状态</span></header><div id="field-error" class="error-banner" hidden role="alert"></div>
<section class="card field-card"><div class="card-heading"><h2>图像采集</h2><span id="capture-total">未创建批次</span></div>
<form id="collection-form" class="field-form"><label>作物<input name="crop_type" placeholder="例如 Apple"></label><label>植物个体 ID<input name="plant_id"></label><label>拍摄会话 ID<input name="session_id"></label><label>场景<select name="scene"><option value="">未记录</option><option value="normal_leaf">正常叶片</option><option value="suspect_leaf">可见异常叶片</option><option value="quality_probe">质量不合格图像</option><option value="non_target">非目标场景</option></select></label>
<label>光照<select name="lighting"><option value="">未记录</option><option value="normal">正常光照</option><option value="low">低光照</option><option value="strong">强光照</option></select></label><label>距离<select name="distance"><option value="">未记录</option><option value="near">近距离</option><option value="far">远距离</option></select></label><label>角度<select name="angle"><option value="">未记录</option><option value="front">正面</option><option value="oblique">倾斜</option><option value="back">背面</option></select></label><label>背景<input name="background"></label><label>拍摄环境<input name="environment" placeholder="室内 / 温室 / 田间"></label><label>异常程度<input name="abnormality_severity"></label><label>采集间隔（秒）<input id="capture-interval" type="number" value="5" min="0.2" max="3600" step="0.1"></label>
<div class="field-actions"><button class="button secondary" type="submit" id="new-batch">创建批次</button><button class="button secondary" type="button" id="capture-one">采集一张</button><button class="button primary" type="button" id="capture-start">按间隔采集</button><button class="button secondary" type="button" id="capture-pause">暂停</button><button class="button secondary" type="button" id="capture-finish">结束批次</button></div></form><div id="capture-result" class="field-status">采集前在设备工作台连接相机和 ESP32</div></section>
<section class="card field-card"><div class="card-heading"><h2>批次与人工标注</h2><button id="refresh-batches" class="button secondary compact">刷新批次</button></div><div class="field-toolbar"><label>批次<select id="batch-list"><option value="">选择批次</option></select></label><button id="previous-sample" class="button secondary">上一张</button><span id="sample-position">0 / 0</span><button id="next-sample" class="button secondary">下一张</button><a id="annotation-export" class="button secondary" href="#">标注 CSV</a><a id="batch-export" class="button secondary" href="#">下载批次（含照片）</a></div>
<div class="field-review"><div><div class="field-images"><figure><figcaption>原始图像</figcaption><img id="original-image" alt="所选样本的原始图像" hidden></figure><figure><figcaption>实际模型输入 · 160 × 160</figcaption><img id="input-image" alt="实际发送到 ESP32 的 RGB 输入" hidden></figure></div><pre id="sample-info">请选择样本</pre><div class="field-prediction"><h3>ESP32 预测</h3><pre id="prediction-info">—</pre><h3>来源标签</h3><pre id="source-info">—</pre></div></div>
<form id="annotation-form" class="field-annotation"><label>目标叶片存在<select name="plant_presence" required><option value="">请选择</option><option>YES</option><option>NO</option><option>UNCERTAIN</option></select></label><label>人工图像质量<select name="image_quality" required><option value="">请选择</option><option>USABLE</option><option>BLUR</option><option>TOO_DARK</option><option>OVEREXPOSED</option><option>LOW_CONTRAST</option><option>OCCLUDED</option></select></label><label>人工视觉标签<select name="visual_label" required><option value="">请选择</option><option>NORMAL</option><option>SUSPECT</option><option>UNCERTAIN</option><option>NOT_APPLICABLE</option></select></label><label>人工判断确定<select name="judgment_certain" required><option value="">请选择</option><option value="true">是</option><option value="false">否</option></select></label>
<label>作物<input name="crop_type"></label><label>拍摄环境<input name="environment"></label><label>光照<input name="lighting"></label><label>距离<input name="distance"></label><label>角度<input name="angle"></label><label>背景<input name="background"></label><label>异常程度<input name="abnormality_severity"></label><label>植物个体 ID<input name="plant_id"></label><label>拍摄会话 ID<input name="session_id"></label><label>标注者<input name="annotator"></label><label>病害标签（可选）<input name="disease_label"></label><label>病害依据<input name="disease_evidence" placeholder="可靠来源或专家结论"></label><label class="field-check"><input name="expert_confirmed" type="checkbox">专家确认</label><label class="field-notes">备注<textarea name="notes" rows="3"></textarea></label><div class="field-actions"><button type="submit" id="save-annotation" class="button primary">保存标注</button><span id="annotation-progress"></span></div></form></div></section>
<section class="card field-card"><div class="card-heading"><h2>批次评价</h2></div><div class="field-toolbar"><label>参考标签<select id="report-labels"><option value="manual">本地人工复核</option><option value="source">公开数据作者标签</option></select></label><button id="generate-report" class="button secondary">生成报告</button></div><pre id="report-result">—</pre></section>
</main></div></body></html>
